name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar pruebas Python
        run: python -m pip install --upgrade pip && python -m pip install -e "clients/python[test]"
      - name: Formato Rust
        run: cargo fmt --all -- --check
      - name: Clippy Rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Pruebas Rust
        run: cargo test --workspace
      - name: Pruebas C#
        run: dotnet test clients/csharp/tests/RamSqlite.Client.Tests/RamSqlite.Client.Tests.csproj
      - name: Pruebas Python y E2E entre lenguajes
        run: python -m pytest clients/python/tests tests/e2e
